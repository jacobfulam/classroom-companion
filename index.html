const sel=selections[classId+':'+view],g=view==='individual'?null:c[view].find(g=>g.id===sel?.id),used=sel&&c.events.some(e=>e.drawId===sel.drawId&&!e.voided);return head+`<section class="draw-panel"><div class="panel-meta"><span>${title}</span><span class="pill">${T('讓每位同學都有機會','Give everyone a turn')}</span></div><div class="draw-main" aria-live="polite"><span class="draw-symbol">✧</span><h2 class="draw-name" id="draw-name">${sel?esc(targetLabel(c,sel.id)):T('準備好未？','Ready?')}</h2>${g?`<p class="draw-member">${g.members.map(id=>esc(c.students.find(s=>s.id===id)?.name)).join(' · ')}</p>`:''}<p>${used?T('已加分，可重抽下一位。','Points awarded. Draw again.'):T('按一下，抽出今次回答的同學或小組。','Tap to draw a student or group.')}</p></div>${sel?'':btn(T('開始抽答 ↗','Start draw ↗'),'draw','start-draw')}<div class="score-actions">${[1,2,3].map(n=>btn('＋'+n,'award','score-action',`data-points="${n}" ${!sel||used?'disabled':''}`)).join('')}${btn(T('重抽','Draw again'),'draw','score-action')}</div></section><div class="draw-bottom"><span>${T('空白鍵抽答 · 1／2／3 加分','Space to draw · 1 / 2 / 3 to award')}</span>${btn(T('撤銷上次加分','Undo latest award'),'undo','text-button')}</div>`+(view==='individual'?`<section class="recent"><h3>${T('最近抽中的學生','Recent draws')}</h3><div class="chips">${(recent[classId]||[]).slice(-8).reverse().map(id=>`<span class="chip">${esc(c.students.find(s=>s.id===id)?.name)}</span>`).join('')}</div></section>`:`<div class="group-grid">${c[view].map((g,i)=>`<section class="group-card ${sel?.id===g.id?'selected':''}" data-size="${g.members.length}" style="${tone(i)};--member-size:${g.members.length<3?28:g.members.length<5?24:21}px"><h3>${groupName(i)}</h3><div class="member-names">${g.members.map(id=>`<span>${esc(c.students.find(s=>s.id===id)?.name)}</span>`).join('')}</div><div class="group-points">${groupScore(c,view,g.id)}<small>${T('分','pts')}</small></div></section>`).join('')}</div><p class="small">${T('卡片顯示本輪小組分數；歷次小組所得保留在學生積分紀錄。','Cards show this grouping’s points; past group awards function table(c,actions=false){return `<div class="table-wrap"><table><thead><tr>${[T('學號','No.'),T('姓名','Name'),T('小組得分','Group points'),T('個人加分','Individual points'),T('總分','Total'),...(actions?[T('操作','Action')]:[])].map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${c.students.map(s=>{const p=scores(c,s.id);return `<tr><td>${esc(s.number)}</td><td>${esc(s.name)}</td><td>${p.group}</td><td>${p.individual}</td><td class="score-cell">${p.total}</td>${actions?`<td>${btn(T('調整分數','Adjust'),'manual','table-adjust',`data-student="${esc(s.id)}"`)}</td>`:''}</tr>`;}).join('')}</tbody></table></div>`;}
function source(e){return e.mode==='manual'?T('手動調分','Manual adjustment'):e.mode==='fixed'?T('固定分組','Fixed group'):e.mode==='instant'?T('即時分組','Instant group'):T('個人抽答','Individual draw');}
function logs(c){return `<h2 class="subheading">${T('加分及調整紀錄','Award and adjustment history')}</h2><div class="table-wrap"><table><thead><tr>${[T('時間','Time'),T('來源／類別','Source / category'),T('學生','Students'),T('分數','Points'),T('操作','Action')].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${[...c.events].reverse().map(e=>`<tr class="${e.voided?'voided':''}"><td>${esc(new Date(e.time).toLocaleString(lang==='en'?'en-GB':'zh-Hant'))}</td><td>${source(e)} · ${category(e)==='group'?T('小組','Group'):T('個人','Individual')}<br><small>${esc(e.reason||'')}</small></td><td>${e.members.map(id=>esc(c.students.find(s=>s.id===id)?.name)).join('、')}</td><td>${e.points>0?'+':''}${e.points}</td><td>${e.voided?T('已撤銷','Voided'):btn(T('撤銷','Undo'),'undo-event','table-undo',`data-event="${esc(e.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`;}
function editor(c){const assigned=new Set(draft.flatMap(g=>g.members));return `<section class="setup"><div class="section-title"><h2>${T('點選姓名，安排小組','Select names to arrange groups')}</h2>${btn(T('↻ 重新分組','↻ Regroup'),'regroup','button primary')}</div><p>${T('先選小組，再點學生。重新分組可隨機編排，或清空後重新安排。','Select a group, then students. Regroup randomly or clear the draft.')}</p><div class="editor-groups">${draft.map((g,i)=>btn(groupName(i)+' · '+g.members.length,'draft-group','chip '+(i===draftIndex?'selected':''),`data-index="${i}"`)).join('')}${btn(T('＋ 新增組','＋ Add group'),'draft-add','chip')}</div><div class="chips">${c.students.map(s=>{let chosen=draft[draftIndex].members.includes(s.id);return btn(esc(s.number)+' '+esc(s.name),'draft-student','chip '+(chosen?'selected':''),`data-id="${esc(s.id)}" ${assigned.has(s.id)&&!chosen?'disabled':''}`);}).join('')}</div><p class="info-note">${assigned.size} / ${c.students.length} ${T('已安排。儲存新分組會開始新一輪小組計分，歷史積分保留。','assigned. Saving changed groups starts a new round; past scores are retained.')}</p><div class="form-actions">${btn(T('取消','Cancel'),'draft-cancel')}${btn(T('儲存分組','Save groups'),'draft-save','button primary',assigned.size!==c.students.length?'disabled':'')}</div></section>`;}
function regroup(){openDialog(T('重新編排固定分組','Regroup fixed groups'),`<p>${T('只修改編輯中的草稿，按「儲存分組」才生效。','Changes affect the draft only until you save groups.')}</p><label class="form-field">${T('每組人數','Students per group')}<select id="regroup-size">${[2,3,4,5,6].map(n=>`<option ${n===4?'selected':''}>${n}</option>`).join('')}</select></label><div class="form-actions">${btn(T('清空所有組員','Clear all members'),'clear-groups')}${btn(T('隨機重新分組','Random regroup'),'random-groups','button primary')}</div>`);}
function manual(student=''){const c=getClass();if(!c.students.length)return notify(T('請先加入學生','Add students first'));openDialog(T('手動調整分數','Adjust points'),`<form id="manual-form"><label class="form-field">${T('調整對象','Recipient')}<select name="target">${c.students.map(s=>`<option value="s:${esc(s.id)}" ${s.id===student?'selected':''}>${esc(s.number)} ${esc(s.name)}</option>`).join('')}${['fixed','instant'].map(mode=>c[mode].map((g,i)=>`<option value="${mode}:${esc(g.id)}">${mode==='fixed'?T('固定','Fixed'):T('即時','Instant')} · ${groupName(i)} (${g.members.length})</option>`).join('')).join('')}</select></label><label class="form-field">${T('分數類別','Score category')}<select name="category"><option value="individual">${T('個人加分','Individual points')}</option><option value="group">${T('小組得分','Group points')}</option></select><small>${T('選擇整組時，記入小組得分，每位組員各獲相同分數。選個別學生的小組類別只修正該生紀錄。','Whole-group adjustments count as group points for every member. A student’s group-category adjustment affects only that student.')}</small></label><div class="quick-points">${[1,2,3].map(n=>btn('＋'+n,'quick','quick-point',`data-points="${n}"`)).join('')}</div><label class="form-field">${T('分數（負數為扣減修正）','Points (negative for corrections)')}<input id="manual-points" name="points" type="number" min="-99" max="99" step="1" value="1" required></label><label class="form-field">${T('原因','Reason')}<input name="reason" value="${T('自願回答','Voluntary answer')}" maxlength="100" required></label><div class="form-actions"><button class="button primary" type="submit">${T('確認記錄','Save adjustment')}</button></div></form>`);}
function settings(){openDialog(T('老師名片與備份','Teacher profile and backup'),`<form id="teacher-form"><label class="form-field">${T('老師稱呼','Teacher name')}<input name="teacher" value="${esc(data.teacher)}" maxlength="80" required></label><button class="button primary">${T('儲存','Save')}</button></form><section class="dialog-section"><h3>${T('資料備份','Backup')}</h3><p>${T('資料存在目前瀏覽器，不會跨裝置同步。備份包含全部班級、分組及積分；還原會取代現有資料。','Data stays in this browser and does not sync across devices. Backups include all classes, groups and scores. Restoring replaces current data.')}</p><div class="form-actions">${btn(T('匯出完整備份','Export full backup'),'backup')}${btn(T('還原備份','Restore backup'),'restore')}</div><input type="file" id="restore-file" accept=".json,application/json" hidden></section>`);}
function classForm(edit=false){const c=edit?getClass():null;openDialog(T(edit?'班級設定':'新增班級',edit?'Class settings':'Add class'),`<form id="class-form" data-edit="${edit}"><label class="form-field">${T('班級名稱','Class name')}<input name="name" required maxlength="80" value="${esc(c?.name||'')}"></label><label class="form-field">${T('課程名稱','Subject')}<input name="subject" required maxlength="80" value="${esc(c?.subject||T('數學','Mathematics'))}"></label><button class="button primary">${T('儲存','Save')}</button></form>`);}
function paste(){openDialog(T('從 Excel 貼上名單','Paste roster from Excel'),`<form id="paste-form"><p>${T('支援姓名一欄，或「學號、姓名」兩欄。名單會追加，不會清除原有學生。','Paste one column of names or two columns: number and name. Students are appended.')}</p><textarea name="roster" rows="10" required></textarea><button class="button primary">${T('預覽名單','Preview roster')}</button></form>`);}
let pasteRows=[];
function targetLabel(c,id){return view==='individual'?c.students.find(s=>s.id===id)?.name||'':groupName(c[view].findIndex(g=>g.id===id));}
async function draw(){if(busy||!getClass()||draft||instantSetup||!['individual','fixed','instant'].includes(view))return;const c=getClass(),pool=view==='individual'?c.students:c[view];if(!pool.length)return;busy=true;const key=classId+':'+view,choices=pool.filter(x=>x.id!==selections[key]?.id),list=choices.length?choices:pool,next=list[Math.floor(Math.random()*list.length)];ClassroomAudio.startDraw();try{await new Promise(resolve=>{let n=0;const timer=setInterval(()=>{const el=$('draw-name');if(el)el.textContent=targetLabel(c,pool[Math.floor(Math.random()*pool.length)].id);if(++n===18){clearInterval(timer);resolve();}},70);});selections[key]={id:next.id,drawId:C.uid()};if(view==='individual')(recent[classId]??=[]).push(next.id);}finally{busy=false;ClassroomAudio.endDraw();render();}}
function award(n){const c=getClass(),s=selections[classId+':'+view];if(!s||c.events.some(e=>e.drawId===s.drawId&&!e.voided))return;const before=c.events.filter(e=>e.drawId===s.drawId);const event=C.award({...c,events:c.events.filter(e=>!e.voided)},view,s.id,n,s.drawId);c.events.push(event);if(save()){ClassroomAudio.award(n);ClassroomEffects.celebrate(n);notify(T('加分已記錄','Points recorded'));}render();}
function undo(event){if(!event||event.voided)return;if(!confirm(T('撤銷這筆紀錄？相關學生的分數會同步還原。','Undo this record? All affected students’ scores will be reversed.')))return;event.voided=true;event.voidedAt=new Date().toISOString();save();render();}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function csv(){const c=getClass(),rows=[[T('學號','No.'),T('姓名','Name'),T('小組得分','Group points'),T('個人加分','Individual points'),T('總分','Total')],...c.students.map(s=>{const p=scores(c,s.id);return [s.number,s.name,p.group,p.individual,p.total];})];download('\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n'),'Classroom-scores.csv','text/csv;charset=utf-8');}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||busy)return;const a=b.dataset.action,c=getClass();try{switch(a){case'language':if($('dialog').open){notify(T('請先完成或關閉目前視窗再切換語言。','Finish or close the current dialog before switching language.'));break;}lang=lang==='en'?'zh':'en';try{localStorage.setItem('classroom-language',lang);}catch{}render();break;case'home':classId=null;draft=null;render();break;case'enter':classId=b.dataset.id;view='individual';draft=null;instantSetup=false;render();break;case'nav':view=b.dataset.view;draft=null;instantSetup=false;render();break;case'narrow':narrow=!narrow;render();break;case'close':closeDialog();break;case'settings':settings();break;case'add-class':classForm();break;case'class-settings':classForm(true);break;case'paste':paste();break;case'draw':await draw();break;case'award':award(Number(b.dataset.points));break;case'manual':manual(b.dataset.student);break;case'quick':$('manual-points').value=b.dataset.points;break;case'undo':undo([...c.events].reverse().find(e=>!e.voided));break;case'undo-event':undo(c.events.find(e=>e.id===b.dataset.event));break;case'edit-fixed':draft=structuredClone(c.fixed.length?c.fixed:[{id:C.uid(),members:[]}]);draftIndex=0;render();break;case'draft-group':draftIndex=Number(b.dataset.index);render();break;case'draft-add':draft.push({id:C.uid(),members:[]});draftIndex=draft.length-1;render();break;case'draft-student':{const m=draft[draftIndex].members,i=m.indexOf(b.dataset.id);if(i<0)m.push(b.dataset.id);else m.splice(i,1);render();break;}case'draft-cancel':draft=null;render();break;case'regroup':regroup();break;case'random-groups':draft=C.partition(c.students.map(s=>s.id),Number($('regroup-size').value));draftIndex=0;closeDialog();render();break;case'clear-groups':draft=draft.map(g=>({...g,members:[]}));draftIndex=0;closeDialog();render();break;case'draft-save':{const groups=draft.filter(g=>g.members.length);if(new Set(groups.flatMap(g=>g.members)).size!==c.students.length)return;if(JSON.stringify(groups)!==JSON.stringify(c.fixed)){c.fixed=groups;c.fixedSession=C.uid();delete selections[classId+':fixed'];save();}draft=null;render();break;}case'instant-setup':instantSetup=true;render();break;case'make-instant':c.instant=C.partition(c.students.map(s=>s.id),Number(b.dataset.size));c.instantSession=C.uid();delete selections[classId+':instant'];instantSetup=false;save();render();break;case'backup':download(JSON.stringify(data,null,2),'Classroom-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json');break;case'restore':$('restore-file').click();break;case'csv':csv();break;case'pdf':exportPDF();break;case'print':printReport();break;case'confirm-paste':{const numbers=new Set(c.students.map(s=>s.number));for(const r of pasteRows){let number=r.number;if(!number){let n=1;while(numbers.has(String(n)))n++;number=String(n);}numbers.add(number);c.students.push({id:C.uid(),number,name:r.name});}if(save())closeDialog();view='roster';render();break;}}}catch(err){notify(T('操作未完成，請檢查輸入。','Action failed. Please check your input.'));console.error(err);}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f),c=getClass();try{if(f.id==='teacher-form'){data.teacher=String(fd.get('teacher')).trim();if(!data.teacher)return;if(save())closeDialog();render();}if(f.id==='class-form'){const name=String(fd.get('name')).trim(),subject=String(fd.get('subject')).trim();if(!name||!subject)return;if(f.dataset.edit==='true'){c.name=name;c.subject=subject;}else data.classes.push(C.makeClass(name,subject));if(save())closeDialog();render();}if(f.id==='manual-form'){const points=Number(fd.get('points')),reason=String(fd.get('reason')).trim(),target=String(fd.get('target')),split=target.indexOf(':'),mode=target.slice(0,split),id=target.slice(split+1);if(!Number.isInteger(points)||!points||Math.abs(points)>99||!reason)return notify(T('請輸入非零整數及原因。','Enter a non-zero integer and a reason.'));if(mode==='s'){const event=C.adjust(c,id,points,reason);event.category=String(fd.get('category'));}else{const g=c[mode].find(g=>g.id===id);c.events.push({id:C.uid(),time:new Date().toISOString(),mode:'manual',category:'group',members:[...g.members],label:groupName(c[mode].indexOf(g)),points,reason,drawId:C.uid(),group:g.id,groupMode:mode,session:c[mode+'Session']});}if(save()){closeDialog();if(points>0){ClassroomAudio.award(Math.min(points,3));ClassroomEffects.celebrate(Math.min(points,3));}}render();}if(f.id==='paste-form'){pasteRows=C.parseRoster(String(fd.get('roster')));const numbers=new Set(c.students.map(s=>s.number));if(!pasteRows.length||pasteRows.length+c.students.length>500)throw Error();for(const r of pasteRows)if(r.number){if(numbers.has(r.number))return notify(T('學號重複，請修正。','Duplicate student numbers. Please correct them.'));numbers.add(r.number);}openDialog(T('確認名單','Confirm roster'),`<p>${pasteRows.length} ${T('位新學生','new students')}</p><div class="preview-list">${pasteRows.map(r=>`<p>${esc(r.number)} ${esc(r.name)}</p>`).join('')}</div>${btn(T('確認加入','Add students'),'confirm-paste','button primary')}`);}}catch(err){notify(T('資料不正確，請檢查輸入。','Invalid data. Please check your input.'));}});
document.addEventListener('change',async e=>{if(e.target.name==='target'){const form=e.target.form,whole=!e.target.value.startsWith('s:');form.elements.category.disabled=whole;if(whole)form.elements.category.value='group';}if(e.target.id!=='restore-file'||!e.target.files[0])return;try{const file=e.target.files[0];if(file.size>10*1024*1024)throw Error();const restored=validate(JSON.parse(await file.text()));if(!confirm(T('還原會取代所有現有班級及積分。確定已備份現有資料？','Restore replaces all current classes and scores. Have you backed up your current data?')))return;localStorage.setItem(KEY,JSON.stringify(restored));data=restored;snapshot=JSON.stringify(data);storageError=false;classId=null;for(const k of Object.keys(selections))delete selections[k];closeDialog();render();notify(T('備份已還原','Backup restored'));}catch{notify(T('無法還原，請檢查備份格式及儲存權限。','Restore failed. Check backup format and storage permissions.'));}});
document.addEventListener('keydown',e=>{if(e.repeat||e.isComposing||$('dialog').open||e.target.closest('input,textarea,select,button')||busy||!getClass()||draft||instantSetup||!['individual','fixed','instant'].includes(view))return;if(e.code==='Space'){e.preventDefault();draw();}else if(['1','2','3'].includes(e.key)){e.preventDefault();award(Number(e.key));}});

function printReport(){const c=getClass();if(!c)return;let r=$('print-report');if(!r){r=document.createElement('section');r.id='print-report';document.body.append(r);}r.innerHTML=`<h1>${T('課堂積分紀錄','Classroom score report')}</h1><p>${esc(data.teacher)} · ${esc(c.name)} · ${esc(c.subject)}</p><p>${esc(new Date().toLocaleString(lang==='en'?'en-GB':'zh-Hant'))}</p><table><thead><tr>${reportHead().map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${reportRows().map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table><p>${T('小組得分包含固定及即時分組，總分包含所有未撤銷的加分及調整。','Group points include fixed and instant groups. Totals include all active awards and adjustments.')}</p><small>CLASSROOM COMPANION @ Fu Sir · 2.0.1</small>`;window.print();}
// Self-contained PDF writer. Rasterized report pages preserve Chinese glyphs offline.
async function exportPDF(){const c=getClass();if(!c)return;notify(T('正在製作 PDF…','Preparing PDF…'));await document.fonts.ready;const rows=reportRows(),pages=[],perPage=28,date=new Date().toLocaleString(lang==='en'?'en-GB':'zh-Hant');for(let start=0;start<Math.max(1,rows.length);start+=perPage){const canvas=document.createElement('canvas');canvas.width=1240;canvas.height=1754;const g=canvas.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,1240,1754);g.fillStyle='#554b65';g.font='bold 44px "PingFang TC", "Noto Sans CJK TC", sans-serif';g.fillText(T('課堂積分紀錄','Classroom score report'),70,100);g.font='26px "PingFang TC", "Noto Sans CJK TC", sans-serif';g.fillText(`${data.teacher} · ${c.name} · ${c.subject}`,70,153,1100);g.font='20px sans-serif';g.fillText(date,70,192);const xs=[70,190,620,820,1020],widths=[120,430,200,200,150];const drawRow=(row,y,head=false)=>{g.fillStyle=head?'#eee5f8':'#faf8fc';g.fillRect(60,y-30,1120,44);for(let i=0;i<row.length;i++){g.fillStyle='#554b65';let size=24;const value=String(row[i]);do{g.font=`${head?'bold ':''}${size}px "PingFang TC", "Noto Sans CJK TC", sans-serif`;if(g.measureText(value).width<=widths[i]-16)break;size--;}while(size>10);g.fillText(value,xs[i],y,widths[i]-16);}};drawRow(reportHead(),260,true);rows.slice(start,start+perPage).forEach((row,i)=>drawRow(row,312+i*45));g.font='19px "PingFang TC", "Noto Sans CJK TC", sans-serif';g.fillStyle='#887793';g.fillText(T('總分＝小組得分＋個人加分；已撤銷紀錄不計算在內。','Total = group + individual points. Voided records are excluded.'),70,1630,1100);g.fillText(`CLASSROOM COMPANION @ Fu Sir · ${Math.floor(start/perPage)+1} / ${Math.max(1,Math.ceil(rows.length/perPage))}`,70,1680);pages.push(Uint8Array.from(atob(canvas.toDataURL('image/jpeg',.94).split(',')[1]),ch=>ch.charCodeAt(0)));}
const enc=new TextEncoder(),parts=[],offsets=[0];let length=0;const append=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);length+=b.length;};const obj=(id,chunks)=>{offsets[id]=length;append(`${id} 0 obj\n`);for(const chunk of chunks)append(chunk);append('\nendobj\n');};append('%PDF-1.4\n');obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);obj(2,[`<< /Type /Pages /Count ${pages.length} /Kids [${pages.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] >>`]);pages.forEach((jpg,i)=>{const id=3+i*3,stream='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';obj(id,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${id+1} 0 R >> >> /Contents ${id+2} 0 R >>`]);obj(id+1,[`<< /Type /XObject /Subtype /Image /Width 1240 /Height 1754 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`,jpg,'\nendstream']);obj(id+2,[`<< /Length ${enc.encode(stream).length} >>\nstream\n${stream}\nendstream`]);});const xref=length;append(`xref\n0 ${offsets.length}\n0000000000 65535 f \n`);for(let i=1;i<offsets.length;i++)append(String(offsets[i]).padStart(10,'0')+' 00000 n \n');append(`trailer\n<< /Size ${offsets.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);download(new Blob(parts),'Classroom-scores-'+c.name.replace(/[\\/:*?"<>|]/g,'-')+'.pdf','application/pdf');notify(T('PDF 已產生','PDF ready'));}
